name: Validate and deploy dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        # MongoDB 8 rejects the hosted runner kernel (SERVER-136848).
        image: mongo:7.0
        ports: [27017:27017]
        env:
          MONGO_INITDB_ROOT_USERNAME: fixture-admin
          MONGO_INITDB_ROOT_PASSWORD: fixture-admin-only
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://fixture-admin:fixture-admin-only@127.0.0.1:27017/?authSource=admin
      - run: go vet ./...
        working-directory: backend
  ingestion:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: [27017:27017]
        env:
          MONGO_INITDB_ROOT_USERNAME: fixture-admin
          MONGO_INITDB_ROOT_PASSWORD: fixture-admin-only
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
        working-directory: ingestion
      - run: pytest -q
        working-directory: ingestion
        env:
          SEC_OFFLINE: 'true'
          SEC_TEST_MONGODB_URI: mongodb://fixture-admin:fixture-admin-only@127.0.0.1:27017/?authSource=admin
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api && git diff --exit-code -- src/api.generated.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        working-directory: infra
      - run: npx wrangler deploy --dry-run --env production && npx wrangler deploy --dry-run --config wrangler.ingestion.jsonc --env production
        working-directory: infra
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --profile fixtures up -d --build
      - name: Verify all three images and real database reads
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/readyz
          curl --fail --retry 10 --retry-all-errors http://127.0.0.1:3000/companies/DEMO
          curl --fail http://127.0.0.1:3000/api/v1/companies/DEMO/metrics
          docker compose exec -T api /api healthcheck
          docker compose exec -T ingestion python -m sec_ingestion bootstrap
          curl --fail --retry 20 --retry-all-errors http://127.0.0.1:8081/readyz
          curl --fail http://127.0.0.1:3000/api/v1/sec/companies
          docker compose exec -T ingestion python -m sec_ingestion healthcheck
      - if: always()
        run: docker compose --profile fixtures down --volumes
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend, ingestion, frontend, gateway, containers]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HOSTNAME: ${{ secrets.CLOUDFLARE_HOSTNAME }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SEC_MONGODB_URI: ${{ secrets.SEC_MONGODB_URI }}
      SEC_MONGODB_DATABASE: ${{ secrets.SEC_MONGODB_DATABASE }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check production configuration
        run: node scripts/deploy.mjs --check
      - run: npm ci
        working-directory: infra
      - name: Deploy production
        run: node scripts/deploy.mjs
      - name: Verify production
        run: node scripts/smoke.mjs
