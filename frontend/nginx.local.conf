# Compose only. Cloudflare routes /api directly to the API binding instead.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    location = /healthz { default_type text/plain; return 200 'ok'; }
    location /api/v1/sec/ { proxy_pass http://ingestion:8080; proxy_read_timeout 40s; }
    location /api/ { proxy_pass http://api:8080; proxy_read_timeout 15s; }
    location / { try_files $uri $uri/ /index.html; }
}
